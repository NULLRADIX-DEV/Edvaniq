name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  TESTINGPLATFORM_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: Build & test backend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Remove app project from solution
        run: dotnet sln Edvaniq.slnx remove src/Clients/Edvaniq.App/Edvaniq.App.csproj

      - name: Restore
        run: dotnet restore Edvaniq.slnx

      - name: Build
        run: dotnet build Edvaniq.slnx -c Release --no-restore

      - name: Test
        run: dotnet test --solution Edvaniq.slnx -c Release --no-build -- --ignore-exit-code 8

      - name: Check service template
        run: |
          dotnet new install ./templates/service --force
          dotnet new edvaniq-service -n Sample
          count=$(dotnet sln Edvaniq.slnx list | grep -c 'Edvaniq\.Services\.Sample\.' || true)
          [ "$count" -eq 7 ] || { echo "::error::Expected 7 projects of the template service in Edvaniq.slnx, found $count"; exit 1; }
          for project in UnitTests IntegrationTests; do
            dotnet test --project "tests/Services/Sample/Edvaniq.Services.Sample.$project" -c Release -- --ignore-exit-code 8
          done

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${file}"
          echo "${GITLEAKS_SHA256}  ${file}" | sha256sum -c -
          tar -xzf "${file}" gitleaks

      - name: Scan git history
        run: ./gitleaks git --no-banner --redact --exit-code 1 .

  images:
    name: Container images
    needs: [build-test, secret-scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      TAG: sha-${{ github.sha }}
      GRYPE_IMAGE: anchore/grype:v0.119.0@sha256:8c2c9234a345577a6d321a4753aa3ee1276d8975c8452d2344a56b57733ecad3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Find processes
        run: |
          mapfile -t names < <(grep -oE 'Projects\.Edvaniq_[A-Za-z0-9_]+' src/Aspire/Edvaniq.AppHost/AppHost.cs | sort -u | sed 's/^Projects\.//; s/_/./g')
          [ "${#names[@]}" -gt 0 ] || { echo "::error::No processes found in AppHost.cs"; exit 1; }
          for name in "${names[@]}"; do
            mapfile -t files < <(git ls-files "*/$name.csproj")
            [ "${#files[@]}" -eq 1 ] || { echo "::error::Expected one project file for $name, found ${#files[@]}"; exit 1; }
            echo "${files[0]}" >> projects.txt
          done
          cat projects.txt

      - name: Build images
        run: |
          mapfile -t projects < projects.txt
          for project in "${projects[@]}"; do
            dotnet publish "$project" -c Release --os linux --arch x64 -t:PublishContainer -p:ContainerImageTag="$TAG"
          done

      - name: Check images
        run: |
          mapfile -t images < <(docker image ls --format '{{.Repository}}:{{.Tag}}' --filter "reference=nullradix-dev/edvaniq/*:$TAG" | sort)
          expected=$(wc -l < projects.txt)
          [ "${#images[@]}" -eq "$expected" ] || { echo "::error::Expected $expected images, found ${#images[@]}"; exit 1; }
          for image in "${images[@]}"; do
            revision=$(docker inspect -f '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")
            [ "$revision" = "$GITHUB_SHA" ] || { echo "::error::$image has revision '$revision', expected $GITHUB_SHA"; exit 1; }
          done
          docker run --rm --entrypoint test "nullradix-dev/edvaniq/web:$TAG" -f /app/wwwroot/_framework/blazor.web.js \
            || { echo "::error::blazor.web.js is missing in the web image"; exit 1; }
          printf '%s\n' "${images[@]}" > images.txt
          cat images.txt
          compose() { APP_COMMIT="$GITHUB_SHA" MYSQL_ROOT_PASSWORD=unused DB_PORT=0 docker compose -f deploy/compose.yml --project-directory "$RUNNER_TEMP" "$@"; }
          compose config --no-env-resolution --images | grep "^$REGISTRY/nullradix-dev/" | sort > composed.txt
          sed "s|^|$REGISTRY/|" images.txt | diff - composed.txt \
            || { echo "::error::deploy/compose.yml does not match the processes in AppHost.cs (< missing, > extra)"; exit 1; }
          grep -oE 'AddMigration<[^>]+>\("[a-z0-9-]+"' src/Aspire/Edvaniq.AppHost/AppHost.cs | grep -oE '"[a-z0-9-]+"' | tr -d '"' | sort > migrations.txt
          comm -13 <(compose config --no-env-resolution --services | sort) <(compose --profile migrate config --no-env-resolution --services | sort) \
            | diff migrations.txt - \
            || { echo "::error::The migration steps in deploy/compose.yml do not match AddMigration in AppHost.cs (< missing, > extra)"; exit 1; }

      - name: Scan base layer (web image)
        run: |
          mkdir -p "$RUNNER_TEMP/scan"
          docker save "nullradix-dev/edvaniq/web:$TAG" -o "$RUNNER_TEMP/scan/image.tar"
          docker run --rm -v "$RUNNER_TEMP/scan:/scan:ro" "$GRYPE_IMAGE" docker-archive:/scan/image.tar --only-fixed --fail-on critical

      - name: Push images
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$REGISTRY_TOKEN" | docker login "$REGISTRY" -u "$GITHUB_ACTOR" --password-stdin
          mapfile -t images < images.txt
          for image in "${images[@]}"; do
            docker tag "$image" "$REGISTRY/$image"
            docker push --quiet "$REGISTRY/$image"
          done
          docker logout "$REGISTRY"
          {
            echo "### Pushed ${#images[@]} images"
            for image in "${images[@]}"; do echo "- \`$REGISTRY/$image\`"; done
          } >> "$GITHUB_STEP_SUMMARY"
