name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  TESTINGPLATFORM_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: Build & test backend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # The MAUI app needs workloads the runner doesn't have. It stays buildable locally.
      - name: Remove app project from solution
        run: dotnet sln Edvaniq.slnx remove src/Clients/Edvaniq.App/Edvaniq.App.csproj

      - name: Restore
        run: dotnet restore Edvaniq.slnx

      - name: Build
        run: dotnet build Edvaniq.slnx -c Release --no-restore

      # Exit code 8 means a test project has no tests yet, not that tests failed.
      - name: Test
        run: dotnet test --solution Edvaniq.slnx -c Release --no-build -- --ignore-exit-code 8
