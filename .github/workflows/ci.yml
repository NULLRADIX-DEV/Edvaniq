name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  TESTINGPLATFORM_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: Build & test backend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # The MAUI app needs workloads the runner doesn't have. It stays buildable locally.
      - name: Remove app project from solution
        run: dotnet sln Edvaniq.slnx remove src/Clients/Edvaniq.App/Edvaniq.App.csproj

      - name: Restore
        run: dotnet restore Edvaniq.slnx

      - name: Build
        run: dotnet build Edvaniq.slnx -c Release --no-restore

      # Exit code 8 means a test project has no tests yet, not that tests failed.
      - name: Test
        run: dotnet test --solution Edvaniq.slnx -c Release --no-build -- --ignore-exit-code 8

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${file}"
          echo "${GITLEAKS_SHA256}  ${file}" | sha256sum -c -
          tar -xzf "${file}" gitleaks

      # Scans every commit, not only the current tree.
      - name: Scan git history
        run: ./gitleaks git --no-banner --redact --exit-code 1 .

  # Builds one image per process. PR images stay on the runner; only main pushes to GHCR.
  images:
    name: Container images
    needs: [build-test, secret-scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      TAG: sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # The AppHost is the list of processes, so a new process needs no extra entry here.
      - name: Find processes
        run: |
          mapfile -t names < <(grep -oE 'Projects\.Edvaniq_[A-Za-z0-9_]+' src/Aspire/Edvaniq.AppHost/AppHost.cs | sort -u | sed 's/^Projects\.//; s/_/./g')
          [ "${#names[@]}" -gt 0 ] || { echo "::error::No processes found in AppHost.cs"; exit 1; }
          for name in "${names[@]}"; do
            mapfile -t files < <(git ls-files "*/$name.csproj")
            [ "${#files[@]}" -eq 1 ] || { echo "::error::Expected one project file for $name, found ${#files[@]}"; exit 1; }
            echo "${files[0]}" >> projects.txt
          done
          cat projects.txt

      # Image names come from ContainerRepository in Directory.Build.props.
      - name: Build images
        run: |
          mapfile -t projects < projects.txt
          for project in "${projects[@]}"; do
            dotnet publish "$project" -c Release --os linux --arch x64 -t:PublishContainer -p:ContainerImageTag="$TAG"
          done

      - name: Check images
        run: |
          mapfile -t images < <(docker image ls --format '{{.Repository}}:{{.Tag}}' --filter "reference=nullradix-dev/edvaniq/*:$TAG" | sort)
          expected=$(wc -l < projects.txt)
          [ "${#images[@]}" -eq "$expected" ] || { echo "::error::Expected $expected images, found ${#images[@]}"; exit 1; }
          for image in "${images[@]}"; do
            revision=$(docker inspect -f '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")
            [ "$revision" = "$GITHUB_SHA" ] || { echo "::error::$image has revision '$revision', expected $GITHUB_SHA"; exit 1; }
          done
          # Without blazor.web.js the UI is dead while the health check stays green.
          docker run --rm --entrypoint test "nullradix-dev/edvaniq/web:$TAG" -f /app/wwwroot/_framework/blazor.web.js \
            || { echo "::error::blazor.web.js is missing in the web image"; exit 1; }
          printf '%s\n' "${images[@]}" > images.txt
          cat images.txt
          # The deploy rolls out deploy/compose.yml, so it must list exactly these images.
          touch "$RUNNER_TEMP/.env"
          EDVANIQ_TAG="$TAG" docker compose -f deploy/compose.yml --project-directory "$RUNNER_TEMP" config --images | sort > composed.txt
          sed "s|^|$REGISTRY/|" images.txt | diff - composed.txt \
            || { echo "::error::deploy/compose.yml does not match the processes in AppHost.cs (< missing, > extra)"; exit 1; }

      # Runs only after every image was built and checked, so a failed build pushes nothing.
      - name: Push images
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$REGISTRY_TOKEN" | docker login "$REGISTRY" -u "$GITHUB_ACTOR" --password-stdin
          mapfile -t images < images.txt
          for image in "${images[@]}"; do
            docker tag "$image" "$REGISTRY/$image"
            docker push --quiet "$REGISTRY/$image"
          done
          docker logout "$REGISTRY"
          {
            echo "### Pushed ${#images[@]} images"
            for image in "${images[@]}"; do echo "- \`$REGISTRY/$image\`"; done
          } >> "$GITHUB_STEP_SUMMARY"
