name: Deploy

# Rolls out all processes of one commit on main to the VPS, or rolls back to the previous release (docs/deploy.md).
# Starting this workflow by hand is the approval; there is no automatic rollout yet.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Commit on main (empty = latest main)
        required: false
        default: ''
      rollback:
        description: Roll back to the previous release (leave commit empty)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    defaults:
      run:
        shell: bash
    steps:
      - name: Check inputs
        if: ${{ inputs.rollback && inputs.commit != '' }}
        run: |
          echo "::error::Either a commit or rollback, not both"; exit 1
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Images only exist for commits on main; deploy.sh refuses a commit whose images are missing.
      - name: Resolve commit
        if: ${{ !inputs.rollback }}
        env:
          COMMIT: ${{ inputs.commit }}
        run: |
          if [ -n "$COMMIT" ] && ! [[ $COMMIT =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "::error::'$COMMIT' is not a commit hash"; exit 1
          fi
          sha=$(git rev-parse --verify --quiet "${COMMIT:-origin/main}^{commit}") || { echo "::error::Unknown commit $COMMIT"; exit 1; }
          git merge-base --is-ancestor "$sha" origin/main || { echo "::error::$sha is not on main"; exit 1; }
          git cat-file -e "$sha:deploy/deploy.sh" 2> /dev/null || { echo "::error::$sha has no deploy folder yet"; exit 1; }
          echo "SHA=$sha" >> "$GITHUB_ENV"
      # The key may only run the receive command on the server (forced command in authorized_keys).
      # A rollback sends nothing: the server keeps the previous release and chooses it itself.
      - name: Deploy
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_TARGET: ${{ secrets.DEPLOY_TARGET }}
          ROLLBACK: ${{ inputs.rollback }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          remote() {
            ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_TARGET" "$@"
          }
          if [ "$ROLLBACK" = true ]; then
            remote rollback < /dev/null
          else
            git archive "$SHA" deploy | remote "deploy $SHA"
          fi | tee "$RUNNER_TEMP/deploy.log"
          deployed=$(sed -n 's/^Deployed //p' "$RUNNER_TEMP/deploy.log")
          previous=$(sed -n 's/^Previous release: //p' "$RUNNER_TEMP/deploy.log")
          kind=''
          if [ "$ROLLBACK" = true ]; then kind=' (Rollback)'; fi
          echo "### Deployed \`$deployed\`$kind" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$previous" ]; then
            echo "Rollback-Ziel: \`$previous\`" >> "$GITHUB_STEP_SUMMARY"
          fi
