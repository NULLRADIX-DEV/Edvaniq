x-app: &app
  restart: unless-stopped
  env_file:
    - path: app.env
      required: true
  mem_limit: 256m
  memswap_limit: 256m
  pids_limit: 128
  cpus: 1
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  read_only: true
  tmpfs:
    - /tmp
  environment:
    ASPNETCORE_HTTP_PORTS: "8080;8081"
    Authentication__Schemes__Bearer__ValidIssuer: https://edvaniq.nullradix.de
  healthcheck:
    test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 30s
    start_interval: 2s

x-skeleton: &skeleton
  <<: *app
  mem_limit: 128m
  memswap_limit: 128m

x-planning: &planning
  <<: *app
  env_file:
    - path: app.env
      required: true
    - path: planning.env
      required: true
  networks: [default, backend]
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: mysql:9.7
    command: ["--innodb-buffer-pool-size=1G"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is missing in .env}
      MYSQL_ROOT_HOST: localhost
    volumes:
      - ./db:/var/lib/mysql
    ports:
      - "127.0.0.1:${DB_PORT:?DB_PORT is missing in .env}:3306"
    labels:
      platform.backup: mysql
    networks: [backend]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /run/mysqld
      - /tmp
    pids_limit: 256
    cpus: 2
    mem_limit: 1536m
    memswap_limit: 1536m
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
      start_interval: 2s
  identity-api:
    <<: *app
    image: ghcr.io/nullradix-dev/edvaniq/identity-api:sha-${APP_COMMIT:?}
  planning-api:
    <<: *planning
    image: ghcr.io/nullradix-dev/edvaniq/planning-api:sha-${APP_COMMIT:?}
  planning-migrate:
    <<: *planning
    image: ghcr.io/nullradix-dev/edvaniq/planning-api:sha-${APP_COMMIT:?}
    command: ["migrate"]
    profiles: [migrate]
    restart: "no"
    healthcheck:
      disable: true
  content-api:
    <<: *app
    image: ghcr.io/nullradix-dev/edvaniq/content-api:sha-${APP_COMMIT:?}
  knowledge-api:
    <<: *app
    image: ghcr.io/nullradix-dev/edvaniq/knowledge-api:sha-${APP_COMMIT:?}
  assessment-api:
    <<: *app
    image: ghcr.io/nullradix-dev/edvaniq/assessment-api:sha-${APP_COMMIT:?}
  flashcards-api:
    <<: *app
    image: ghcr.io/nullradix-dev/edvaniq/flashcards-api:sha-${APP_COMMIT:?}
  learningengine-api:
    <<: *app
    image: ghcr.io/nullradix-dev/edvaniq/learningengine-api:sha-${APP_COMMIT:?}
  tutor-api:
    <<: *skeleton
    image: ghcr.io/nullradix-dev/edvaniq/tutor-api:sha-${APP_COMMIT:?}
  gamification-api:
    <<: *skeleton
    image: ghcr.io/nullradix-dev/edvaniq/gamification-api:sha-${APP_COMMIT:?}
  analytics-api:
    <<: *skeleton
    image: ghcr.io/nullradix-dev/edvaniq/analytics-api:sha-${APP_COMMIT:?}
  notifications-api:
    <<: *skeleton
    image: ghcr.io/nullradix-dev/edvaniq/notifications-api:sha-${APP_COMMIT:?}
  content-worker:
    <<: *app
    image: ghcr.io/nullradix-dev/edvaniq/content-worker:sha-${APP_COMMIT:?}
    healthcheck:
      disable: true
  notifications-worker:
    <<: *skeleton
    image: ghcr.io/nullradix-dev/edvaniq/notifications-worker:sha-${APP_COMMIT:?}
    healthcheck:
      disable: true
  gateway:
    <<: *app
    image: ghcr.io/nullradix-dev/edvaniq/gateway:sha-${APP_COMMIT:?}
  web:
    <<: *app
    image: ghcr.io/nullradix-dev/edvaniq/web:sha-${APP_COMMIT:?}

networks:
  backend:
