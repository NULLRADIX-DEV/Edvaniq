x-app: &app
  restart: unless-stopped
  env_file:
    - path: app.env
      required: true
  mem_limit: 256m
  memswap_limit: 256m
  pids_limit: 128
  cpus: 1
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  read_only: true
  tmpfs:
    - /tmp
  networks: [inner]
  environment: &app-environment
    ASPNETCORE_HTTP_PORTS: "8080;8081"
    Authentication__Schemes__Bearer__ValidIssuer: &issuer https://edvaniq.nullradix.de
    Authentication__Schemes__Bearer__Authority: http://identity-api:8080
    Authentication__Schemes__Bearer__RequireHttpsMetadata: "false"
  healthcheck:
    test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && tr -d '\\r' <&3 | awk 'NR == 1 { ok = / 200 / } { print } END { exit !ok }'"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 30s
    start_interval: 2s

x-skeleton: &skeleton
  <<: *app
  mem_limit: 128m
  memswap_limit: 128m

x-messaging-environment: &messaging-environment
  <<: *app-environment
  ConnectionStrings__nats: nats://nats:4222

x-db-only: &db-only
  db:
    condition: service_healthy

x-db-and-broker: &db-and-broker
  db:
    condition: service_healthy
  nats:
    condition: service_healthy

x-identity: &identity
  <<: *app
  env_file:
    - path: app.env
      required: true
    - path: identity.env
      required: true
  networks: [inner, data]
  environment: *messaging-environment
  depends_on: *db-and-broker

x-planning: &planning
  <<: *app
  env_file:
    - path: app.env
      required: true
    - path: planning.env
      required: true
  networks: [inner, data]
  environment: *messaging-environment
  depends_on: *db-and-broker

x-content: &content
  <<: *app
  env_file:
    - path: app.env
      required: true
    - path: content.env
      required: true
  networks: [inner, data]
  environment: *messaging-environment
  depends_on: *db-and-broker

x-knowledge: &knowledge
  <<: *app
  env_file:
    - path: app.env
      required: true
    - path: knowledge.env
      required: true
  networks: [inner, data]
  environment: *messaging-environment
  depends_on: *db-and-broker

x-assessment: &assessment
  <<: *app
  env_file:
    - path: app.env
      required: true
    - path: assessment.env
      required: true
  networks: [inner, data]
  environment: *messaging-environment
  depends_on: *db-and-broker

x-learningengine: &learningengine
  <<: *app
  env_file:
    - path: app.env
      required: true
    - path: learningengine.env
      required: true
  networks: [inner, data]
  environment: *messaging-environment
  depends_on: *db-and-broker

services:
  db:
    image: mysql:9.7@sha256:df90258da46f6e7ff8574ff84f17618aba0765cac749928299c69fd4e7cb8ad8
    command: ["--innodb-buffer-pool-size=1G", "--binlog-expire-logs-seconds=86400"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is missing in .env}
      MYSQL_ROOT_HOST: localhost
    volumes:
      - ./db:/var/lib/mysql
    ports:
      - "127.0.0.1:${DB_PORT:?DB_PORT is missing in .env}:3306"
    labels:
      platform.backup: mysql
    networks: [data, backend]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /run/mysqld
      - /tmp
    pids_limit: 256
    cpus: 2
    mem_limit: 1536m
    memswap_limit: 1536m
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
      start_interval: 2s
  nats:
    image: nats:2.15-alpine@sha256:afae2fdbe2e326c65e1246cb83b9d05d319188734f3bd577ac8072daae78a10f
    command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222"]
    user: "65534:65534"
    environment:
      GOMEMLIMIT: 200MiB
    volumes:
      - ./nats:/data
    networks: [data]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 64
    cpus: 1
    mem_limit: 256m
    memswap_limit: 256m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8222/healthz?js-enabled-only=true"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
      start_interval: 2s
  identity-api:
    <<: *identity
    image: ghcr.io/nullradix-dev/edvaniq/identity-api:sha-${APP_COMMIT:?}
    env_file:
      - path: app.env
        required: true
      - path: identity.env
        required: true
      - path: identity-tokens.env
        required: true
    environment:
      <<: *messaging-environment
      Tokens__Issuer: *issuer
  identity-migrate:
    <<: *identity
    image: ghcr.io/nullradix-dev/edvaniq/identity-api:sha-${APP_COMMIT:?}
    command: ["migrate"]
    depends_on: *db-only
    profiles: [migrate]
    restart: "no"
    healthcheck:
      disable: true
  smoke-prepare:
    <<: *identity
    image: ghcr.io/nullradix-dev/edvaniq/identity-api:sha-${APP_COMMIT:?}
    entrypoint: ["bash", "-c", "exec dotnet /app/Edvaniq.Services.Identity.Api.dll account set \"$$SMOKE_ACCOUNT\" --test-double"]
    profiles: [smoke]
    restart: "no"
    healthcheck:
      disable: true
  smoke-cleanup:
    <<: *identity
    image: ghcr.io/nullradix-dev/edvaniq/identity-api:sha-${APP_COMMIT:?}
    entrypoint: ["bash", "-c", "exec dotnet /app/Edvaniq.Services.Identity.Api.dll account delete \"$$SMOKE_ACCOUNT\""]
    profiles: [smoke]
    restart: "no"
    healthcheck:
      disable: true
  planning-api:
    <<: *planning
    image: ghcr.io/nullradix-dev/edvaniq/planning-api:sha-${APP_COMMIT:?}
    environment:
      <<: *messaging-environment
      services__learningengine-api__http__0: http://learningengine-api:8080
      services__assessment-api__http__0: http://assessment-api:8080
  planning-migrate:
    <<: *planning
    image: ghcr.io/nullradix-dev/edvaniq/planning-api:sha-${APP_COMMIT:?}
    command: ["migrate"]
    depends_on: *db-only
    profiles: [migrate]
    restart: "no"
    healthcheck:
      disable: true
  content-api:
    <<: *content
    image: ghcr.io/nullradix-dev/edvaniq/content-api:sha-${APP_COMMIT:?}
    volumes:
      - ./data/content-files:/files
    environment:
      <<: *messaging-environment
      services__planning-api__http__0: http://planning-api:8080
      FileStorage__Directory: /files
  content-migrate:
    <<: *content
    image: ghcr.io/nullradix-dev/edvaniq/content-api:sha-${APP_COMMIT:?}
    command: ["migrate"]
    depends_on: *db-only
    profiles: [migrate]
    restart: "no"
    healthcheck:
      disable: true
  knowledge-api:
    <<: *knowledge
    image: ghcr.io/nullradix-dev/edvaniq/knowledge-api:sha-${APP_COMMIT:?}
  knowledge-migrate:
    <<: *knowledge
    image: ghcr.io/nullradix-dev/edvaniq/knowledge-api:sha-${APP_COMMIT:?}
    command: ["migrate"]
    depends_on: *db-only
    profiles: [migrate]
    restart: "no"
    healthcheck:
      disable: true
  assessment-api:
    <<: *assessment
    image: ghcr.io/nullradix-dev/edvaniq/assessment-api:sha-${APP_COMMIT:?}
  assessment-migrate:
    <<: *assessment
    image: ghcr.io/nullradix-dev/edvaniq/assessment-api:sha-${APP_COMMIT:?}
    command: ["migrate"]
    depends_on: *db-only
    profiles: [migrate]
    restart: "no"
    healthcheck:
      disable: true
  flashcards-api:
    <<: *app
    image: ghcr.io/nullradix-dev/edvaniq/flashcards-api:sha-${APP_COMMIT:?}
  learningengine-api:
    <<: *learningengine
    image: ghcr.io/nullradix-dev/edvaniq/learningengine-api:sha-${APP_COMMIT:?}
  learningengine-migrate:
    <<: *learningengine
    image: ghcr.io/nullradix-dev/edvaniq/learningengine-api:sha-${APP_COMMIT:?}
    command: ["migrate"]
    depends_on: *db-only
    profiles: [migrate]
    restart: "no"
    healthcheck:
      disable: true
  tutor-api:
    <<: *skeleton
    image: ghcr.io/nullradix-dev/edvaniq/tutor-api:sha-${APP_COMMIT:?}
  gamification-api:
    <<: *skeleton
    image: ghcr.io/nullradix-dev/edvaniq/gamification-api:sha-${APP_COMMIT:?}
  analytics-api:
    <<: *skeleton
    image: ghcr.io/nullradix-dev/edvaniq/analytics-api:sha-${APP_COMMIT:?}
  notifications-api:
    <<: *skeleton
    image: ghcr.io/nullradix-dev/edvaniq/notifications-api:sha-${APP_COMMIT:?}
  content-worker:
    <<: *content
    image: ghcr.io/nullradix-dev/edvaniq/content-worker:sha-${APP_COMMIT:?}
    env_file:
      - path: app.env
        required: true
      - path: content.env
        required: true
      - path: content-worker.env
        required: true
    networks: [inner, data, egress]
    volumes:
      - ./data/content-files:/files:ro
    environment:
      <<: *messaging-environment
      services__identity-api__http__0: http://identity-api:8080
      services__knowledge-api__http__0: http://knowledge-api:8080
      FileStorage__Directory: /files
    healthcheck:
      disable: true
  notifications-worker:
    <<: *skeleton
    image: ghcr.io/nullradix-dev/edvaniq/notifications-worker:sha-${APP_COMMIT:?}
    healthcheck:
      disable: true
  gateway:
    <<: *app
    image: ghcr.io/nullradix-dev/edvaniq/gateway:sha-${APP_COMMIT:?}
    environment:
      <<: *app-environment
      services__planning-api__http__0: http://planning-api:8080
      services__content-api__http__0: http://content-api:8080
      services__knowledge-api__http__0: http://knowledge-api:8080
      services__assessment-api__http__0: http://assessment-api:8080
      services__learningengine-api__http__0: http://learningengine-api:8080
      services__identity-api__http__0: http://identity-api:8080
  web:
    <<: *app
    image: ghcr.io/nullradix-dev/edvaniq/web:sha-${APP_COMMIT:?}
    env_file:
      - path: app.env
        required: true
      - path: web.env
        required: true
    ports:
      - "127.0.0.1:${APP_PORT:?}:8080"
    volumes:
      - ./data/web-keys:/keys
    networks: [default, inner]
    environment:
      <<: *app-environment
      services__gateway__http__0: http://gateway:8080
      DataProtection__KeysDirectory: /keys
      ForwardedHeaders__KnownNetworks__0: ${APP_SUBNET:?}

networks:
  inner:
    internal: true
  data:
    internal: true
  backend:
  egress:
