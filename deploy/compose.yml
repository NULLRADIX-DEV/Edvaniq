# All processes of one commit, rolled out together by the Deploy workflow through the server platform, where Edvaniq
# runs as its own app (own user, rootless Docker, memory cap). The server sets APP_COMMIT and checks the file first.
# Every service here needs its entry in AppHost.cs; the CI job "Container images" checks both lists match.

x-app: &app
  restart: unless-stopped
  # Secrets only come from app.env on the server (docs/secrets.md).
  env_file:
    - path: app.env
      required: true
  # Own memory limit and no swap: a container that runs out is killed and restarted alone. All limits together
  # (10 x 256m + 5 x 128m) stay well below the app's memory cap on the server, which also has to hold Docker itself.
  mem_limit: 256m
  memswap_limit: 256m
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  # Health answers only on the internal port 8081 (ServiceDefaults), which is never published. The image has bash but no
  # curl. The deploy waits until every container is healthy and restores the previous state if one is not.
  environment:
    ASPNETCORE_HTTP_PORTS: "8080;8081"
  healthcheck:
    test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 30s
    start_interval: 2s

# Processes that stay a skeleton in the MVP need less.
x-skeleton: &skeleton
  <<: *app
  mem_limit: 128m
  memswap_limit: 128m

services:
  identity-api:
    <<: *app
    image: ghcr.io/nullradix-dev/edvaniq/identity-api:sha-${APP_COMMIT:?}
  planning-api:
    <<: *app
    image: ghcr.io/nullradix-dev/edvaniq/planning-api:sha-${APP_COMMIT:?}
  content-api:
    <<: *app
    image: ghcr.io/nullradix-dev/edvaniq/content-api:sha-${APP_COMMIT:?}
  knowledge-api:
    <<: *app
    image: ghcr.io/nullradix-dev/edvaniq/knowledge-api:sha-${APP_COMMIT:?}
  assessment-api:
    <<: *app
    image: ghcr.io/nullradix-dev/edvaniq/assessment-api:sha-${APP_COMMIT:?}
  flashcards-api:
    <<: *app
    image: ghcr.io/nullradix-dev/edvaniq/flashcards-api:sha-${APP_COMMIT:?}
  learningengine-api:
    <<: *app
    image: ghcr.io/nullradix-dev/edvaniq/learningengine-api:sha-${APP_COMMIT:?}
  tutor-api:
    <<: *skeleton
    image: ghcr.io/nullradix-dev/edvaniq/tutor-api:sha-${APP_COMMIT:?}
  gamification-api:
    <<: *skeleton
    image: ghcr.io/nullradix-dev/edvaniq/gamification-api:sha-${APP_COMMIT:?}
  analytics-api:
    <<: *skeleton
    image: ghcr.io/nullradix-dev/edvaniq/analytics-api:sha-${APP_COMMIT:?}
  notifications-api:
    <<: *skeleton
    image: ghcr.io/nullradix-dev/edvaniq/notifications-api:sha-${APP_COMMIT:?}
  # Workers have no HTTP, so no health check.
  content-worker:
    <<: *app
    image: ghcr.io/nullradix-dev/edvaniq/content-worker:sha-${APP_COMMIT:?}
    healthcheck:
      disable: true
  notifications-worker:
    <<: *skeleton
    image: ghcr.io/nullradix-dev/edvaniq/notifications-worker:sha-${APP_COMMIT:?}
    healthcheck:
      disable: true
  gateway:
    <<: *app
    image: ghcr.io/nullradix-dev/edvaniq/gateway:sha-${APP_COMMIT:?}
  web:
    <<: *app
    image: ghcr.io/nullradix-dev/edvaniq/web:sha-${APP_COMMIT:?}
