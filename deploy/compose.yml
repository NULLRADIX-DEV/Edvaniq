# All processes of one commit, rolled out together by the Deploy workflow through the server platform, where Edvaniq
# runs as its own app (own user, rootless Docker, memory cap). The server sets APP_COMMIT and checks the file first.
# Every service here needs its entry in AppHost.cs; the CI job "Container images" checks both lists match.

x-app: &app
  restart: unless-stopped
  # Secrets only come from app.env on the server (docs/secrets.md).
  env_file:
    - path: app.env
      required: true
  # Provisional limit so Edvaniq can never starve the other apps on the VPS; tuned in #160.
  mem_limit: 256m
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

services:
  identity-api:
    <<: *app
    image: ghcr.io/nullradix-dev/edvaniq/identity-api:sha-${APP_COMMIT:?}
  planning-api:
    <<: *app
    image: ghcr.io/nullradix-dev/edvaniq/planning-api:sha-${APP_COMMIT:?}
  content-api:
    <<: *app
    image: ghcr.io/nullradix-dev/edvaniq/content-api:sha-${APP_COMMIT:?}
  knowledge-api:
    <<: *app
    image: ghcr.io/nullradix-dev/edvaniq/knowledge-api:sha-${APP_COMMIT:?}
  assessment-api:
    <<: *app
    image: ghcr.io/nullradix-dev/edvaniq/assessment-api:sha-${APP_COMMIT:?}
  flashcards-api:
